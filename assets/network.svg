<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="animated SNSX mission network">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1b2e"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfeff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="link1" d="M 600 150 Q 390 80 190 82"/>
    <path id="link2" d="M 600 150 Q 390 230 190 218"/>
    <path id="link3" d="M 600 150 Q 600 70 600 44"/>
    <path id="link4" d="M 600 150 Q 810 80 1010 82"/>
    <path id="link5" d="M 600 150 Q 810 230 1010 218"/>
    <path id="link6" d="M 600 150 Q 600 230 600 256"/>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="22" fill="url(#panel)" stroke="#1e3a5f" stroke-opacity="0.7"/>
  <g stroke="#38bdf8" stroke-opacity="0.06">
    <path d="M40 60 H1160 M40 120 H1160 M40 180 H1160 M40 240 H1160"/>
    <path d="M120 30 V270 M300 30 V270 M480 30 V270 M720 30 V270 M900 30 V270 M1080 30 V270"/>
  </g>

  <g fill="none" stroke-width="1.5">
    <use xlink:href="#link1" stroke="#34d399" stroke-opacity="0.4" stroke-dasharray="6 9"><animate attributeName="stroke-dashoffset" from="0" to="-150" dur="7s" repeatCount="indefinite"/></use>
    <use xlink:href="#link2" stroke="#22d3ee" stroke-opacity="0.4" stroke-dasharray="6 9"><animate attributeName="stroke-dashoffset" from="0" to="150" dur="8s" repeatCount="indefinite"/></use>
    <use xlink:href="#link3" stroke="#a78bfa" stroke-opacity="0.4" stroke-dasharray="5 8"><animate attributeName="stroke-dashoffset" from="0" to="-130" dur="6s" repeatCount="indefinite"/></use>
    <use xlink:href="#link4" stroke="#f472b6" stroke-opacity="0.4" stroke-dasharray="6 9"><animate attributeName="stroke-dashoffset" from="0" to="150" dur="7.5s" repeatCount="indefinite"/></use>
    <use xlink:href="#link5" stroke="#fbbf24" stroke-opacity="0.4" stroke-dasharray="6 9"><animate attributeName="stroke-dashoffset" from="0" to="-150" dur="8.5s" repeatCount="indefinite"/></use>
    <use xlink:href="#link6" stroke="#34d399" stroke-opacity="0.4" stroke-dasharray="5 8"><animate attributeName="stroke-dashoffset" from="0" to="130" dur="6.5s" repeatCount="indefinite"/></use>
  </g>

  <g fill="#ecfeff" filter="url(#glow)">
    <circle r="2.6"><animateMotion dur="7s" repeatCount="indefinite"><mpath xlink:href="#link1"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="8s" repeatCount="indefinite"><mpath xlink:href="#link2"/></animateMotion></circle>
    <circle r="2.4" fill="#ddd6fe"><animateMotion dur="6s" repeatCount="indefinite"><mpath xlink:href="#link3"/></animateMotion></circle>
    <circle r="2.6" fill="#fbcfe8"><animateMotion dur="7.5s" repeatCount="indefinite"><mpath xlink:href="#link4"/></animateMotion></circle>
    <circle r="2.6" fill="#fde68a"><animateMotion dur="8.5s" repeatCount="indefinite"><mpath xlink:href="#link5"/></animateMotion></circle>
    <circle r="2.4"><animateMotion dur="6.5s" repeatCount="indefinite"><mpath xlink:href="#link6"/></animateMotion></circle>
  </g>

  <circle cx="600" cy="150" r="66" fill="url(#coreGlow)">
    <animate attributeName="r" values="58;74;58" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="150" r="34" fill="#06111f" stroke="#22d3ee" stroke-opacity="0.65"/>
  <circle cx="600" cy="150" r="8" fill="#ecfeff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="150" r="52" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-dasharray="8 10">
    <animateTransform attributeName="transform" type="rotate" from="0 600 150" to="360 600 150" dur="20s" repeatCount="indefinite"/>
  </circle>

  <g font-family="Fira Code, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#dbeafe">
    <g transform="translate(190 82)">
      <circle r="22" fill="#07192a" stroke="#34d399" stroke-opacity="0.7"/>
      <circle r="29" fill="none" stroke="#34d399" stroke-opacity="0.28"><animate attributeName="r" values="22;32;22" dur="3.2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0.05;0.5" dur="3.2s" repeatCount="indefinite"/></circle>
      <text y="5">LANG</text>
    </g>
    <g transform="translate(190 218)">
      <circle r="22" fill="#07192a" stroke="#22d3ee" stroke-opacity="0.7"/>
      <circle r="29" fill="none" stroke="#22d3ee" stroke-opacity="0.28"><animate attributeName="r" values="22;32;22" dur="3.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0.05;0.5" dur="3.6s" repeatCount="indefinite"/></circle>
      <text y="5">SYS</text>
    </g>
    <g transform="translate(600 44)">
      <circle r="22" fill="#07192a" stroke="#c4b5fd" stroke-opacity="0.7"/>
      <circle r="29" fill="none" stroke="#c4b5fd" stroke-opacity="0.28"><animate attributeName="r" values="22;32;22" dur="4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0.05;0.5" dur="4s" repeatCount="indefinite"/></circle>
      <text y="5">SEC</text>
    </g>
    <g transform="translate(1010 82)">
      <circle r="22" fill="#07192a" stroke="#f472b6" stroke-opacity="0.7"/>
      <circle r="29" fill="none" stroke="#f472b6" stroke-opacity="0.28"><animate attributeName="r" values="22;32;22" dur="3.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0.05;0.5" dur="3.4s" repeatCount="indefinite"/></circle>
      <text y="5">AI</text>
    </g>
    <g transform="translate(1010 218)">
      <circle r="22" fill="#07192a" stroke="#fbbf24" stroke-opacity="0.7"/>
      <circle r="29" fill="none" stroke="#fbbf24" stroke-opacity="0.28"><animate attributeName="r" values="22;32;22" dur="4.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0.05;0.5" dur="4.4s" repeatCount="indefinite"/></circle>
      <text y="5">EDU</text>
    </g>
    <g transform="translate(600 256)">
      <circle r="22" fill="#07192a" stroke="#67e8f9" stroke-opacity="0.7"/>
      <circle r="29" fill="none" stroke="#67e8f9" stroke-opacity="0.28"><animate attributeName="r" values="22;32;22" dur="3.8s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0.05;0.5" dur="3.8s" repeatCount="indefinite"/></circle>
      <text y="5">SPACE</text>
    </g>
  </g>

  <text x="600" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2.5" fill="#ecfeff">SNSX</text>
  <text x="34" y="284" font-family="Fira Code, Consolas, monospace" font-size="11" letter-spacing="2" fill="#64748b">SIX LAYERS / ONE SYSTEM</text>
  <text x="1166" y="284" text-anchor="end" font-family="Fira Code, Consolas, monospace" font-size="11" letter-spacing="2" fill="#64748b">NETWORK: ONLINE</text>
</svg>
