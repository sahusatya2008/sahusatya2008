<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-label="animated mission timeline from 2020 to infinity">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07182a"/>
      <stop offset="50%" stop-color="#0b1c33"/>
      <stop offset="100%" stop-color="#07182a"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="timelinePath" d="M 90 104 C 340 54 520 148 760 96 C 940 56 1040 120 1110 88"/>
  </defs>

  <rect x="1" y="1" width="1198" height="178" rx="20" fill="url(#panel)" stroke="#1e3a5f" stroke-opacity="0.7"/>

  <g fill="#e0f2fe">
    <circle cx="120" cy="40" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="140" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="36" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="146" r="1.2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="42" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <use xlink:href="#timelinePath" fill="none" stroke="#0f2942" stroke-width="8" stroke-linecap="round"/>
  <use xlink:href="#timelinePath" fill="none" stroke="url(#track)" stroke-width="3" stroke-linecap="round" stroke-dasharray="120 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-268" dur="7s" repeatCount="indefinite"/>
  </use>

  <circle r="4.5" fill="#ecfeff" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite"><mpath xlink:href="#timelinePath"/></animateMotion>
  </circle>
  <circle r="2" fill="#fbcfe8">
    <animateMotion dur="7s" begin="-0.7s" repeatCount="indefinite"><mpath xlink:href="#timelinePath"/></animateMotion>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g font-family="Fira Code, Consolas, monospace" text-anchor="middle">
    <g transform="translate(90 104)">
      <circle r="9" fill="#07192a" stroke="#34d399" stroke-width="2"/>
      <circle r="15" fill="none" stroke="#34d399" stroke-opacity="0.4"><animate attributeName="r" values="9;18;9" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/></circle>
      <text y="-24" font-size="13" font-weight="800" fill="#6ee7b7">2020</text>
      <text y="34" font-size="10" letter-spacing="2" fill="#94a3b8">BOOT</text>
    </g>
    <g transform="translate(400 100)">
      <circle r="9" fill="#07192a" stroke="#22d3ee" stroke-width="2"/>
      <circle r="15" fill="none" stroke="#22d3ee" stroke-opacity="0.4"><animate attributeName="r" values="9;18;9" dur="3.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="3.6s" repeatCount="indefinite"/></circle>
      <text y="-24" font-size="13" font-weight="800" fill="#67e8f9">2024</text>
      <text y="34" font-size="10" letter-spacing="2" fill="#94a3b8">BUILD</text>
    </g>
    <g transform="translate(760 96)">
      <circle r="9" fill="#07192a" stroke="#c4b5fd" stroke-width="2"/>
      <circle r="15" fill="none" stroke="#c4b5fd" stroke-opacity="0.4"><animate attributeName="r" values="9;18;9" dur="4.2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="4.2s" repeatCount="indefinite"/></circle>
      <text y="-24" font-size="13" font-weight="800" fill="#ddd6fe">2026</text>
      <text y="34" font-size="10" letter-spacing="2" fill="#94a3b8">ORBIT</text>
    </g>
    <g transform="translate(1110 88)">
      <circle r="9" fill="#07192a" stroke="#f0abfc" stroke-width="2"/>
      <circle r="15" fill="none" stroke="#f0abfc" stroke-opacity="0.4"><animate attributeName="r" values="9;18;9" dur="3.3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="3.3s" repeatCount="indefinite"/></circle>
      <text y="-24" font-size="13" font-weight="800" fill="#fbcfe8">∞</text>
      <text y="34" font-size="10" letter-spacing="2" fill="#94a3b8">BEYOND</text>
    </g>
  </g>

  <text x="34" y="32" font-family="Fira Code, Consolas, monospace" font-size="11" letter-spacing="2.4" fill="#6ee7b7">MISSION TIMELINE // 2020 → ∞</text>
  <text x="1166" y="160" text-anchor="end" font-family="Fira Code, Consolas, monospace" font-size="11" letter-spacing="2.4" fill="#94a3b8">THE TRAJECTORY IS STILL CLIMBING</text>
</svg>
