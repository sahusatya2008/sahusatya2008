<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="180" viewBox="0 0 1400 180" role="img" aria-label="animated launch sequence portal">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#061321"/>
      <stop offset="50%" stop-color="#0b1a31"/>
      <stop offset="100%" stop-color="#061321"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1398" height="178" rx="20" fill="url(#panel)" stroke="#1e3a5f" stroke-opacity="0.7"/>

  <g fill="none" stroke="#22d3ee">
    <ellipse cx="700" cy="90" rx="540" ry="66" stroke-opacity="0.16" stroke-dasharray="4 14">
      <animate attributeName="stroke-dashoffset" from="0" to="180" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="90" rx="470" ry="56" stroke="#c4b5fd" stroke-opacity="0.18" stroke-dasharray="3 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-150" dur="11s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g fill="none" stroke-width="1.6">
    <ellipse cx="700" cy="90" rx="520" ry="64" stroke="#34d399" stroke-opacity="0.32">
      <animate attributeName="rx" values="520;60" dur="4.8s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="64;7" dur="4.8s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.4;0" dur="4.8s" begin="0s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="90" rx="520" ry="64" stroke="#22d3ee" stroke-opacity="0.32">
      <animate attributeName="rx" values="520;60" dur="4.8s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="64;7" dur="4.8s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.4;0" dur="4.8s" begin="-1.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="90" rx="520" ry="64" stroke="#a78bfa" stroke-opacity="0.32">
      <animate attributeName="rx" values="520;60" dur="4.8s" begin="-2.4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="64;7" dur="4.8s" begin="-2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.4;0" dur="4.8s" begin="-2.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="90" rx="520" ry="64" stroke="#f0abfc" stroke-opacity="0.32">
      <animate attributeName="rx" values="520;60" dur="4.8s" begin="-3.6s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="64;7" dur="4.8s" begin="-3.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.4;0" dur="4.8s" begin="-3.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <line x1="230" y1="90" x2="1170" y2="90" stroke="url(#beam)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
  </line>
  <circle r="3.4" fill="#ecfeff" filter="url(#glow)">
    <animateMotion path="M 230 90 L 1170 90" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g fill="#a5f3fc">
    <circle cx="286" cy="54" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="126" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="970" cy="50" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1114" cy="128" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="Fira Code, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2.4">
    <text x="34" y="52" fill="#6ee7b7">LAUNCH SEQUENCE</text>
    <text x="34" y="78" fill="#94a3b8">SYSTEM ARMED  /  CORE ONLINE</text>
    <text x="1366" y="52" text-anchor="end" fill="#c4b5fd">ORBIT LOCK: STABLE</text>
    <text x="1366" y="78" text-anchor="end" fill="#67e8f9">UPLINK: 100%</text>
  </g>

  <g font-family="Fira Code, Consolas, monospace" font-size="13" font-weight="800" text-anchor="middle" fill="#ecfeff">
    <text x="700" y="84" opacity="0">
      <set attributeName="opacity" to="1" begin="0s" dur="1.2s" repeatCount="indefinite"/>BOOTING CORE
    </text>
    <text x="700" y="84" opacity="0">
      <set attributeName="opacity" to="1" begin="1.2s" dur="1.2s" repeatCount="indefinite"/>COMPILING IDEAS
    </text>
    <text x="700" y="84" opacity="0">
      <set attributeName="opacity" to="1" begin="2.4s" dur="1.2s" repeatCount="indefinite"/>ENTERING ORBIT
    </text>
    <text x="700" y="84" opacity="0">
      <set attributeName="opacity" to="1" begin="3.6s" dur="1.2s" repeatCount="indefinite"/>SIGNAL LIVE
    </text>
  </g>

  <g>
    <rect x="320" y="136" width="760" height="6" rx="3" fill="#0c1b2c"/>
    <rect x="320" y="136" width="0" height="6" rx="3" fill="#34d399">
      <animate attributeName="width" values="0;760" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="320" cy="139" r="4" fill="#ecfeff" filter="url(#glow)">
      <animate attributeName="cx" values="320;1080" dur="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
