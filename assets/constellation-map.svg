<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="animated SNSX technology constellation map">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081729"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfeff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="c1" d="M600 140 Q 400 60 170 72"/>
    <path id="c2" d="M600 140 Q 400 220 170 208"/>
    <path id="c3" d="M600 140 Q 480 30 360 48"/>
    <path id="c4" d="M600 140 Q 480 250 360 232"/>
    <path id="c5" d="M600 140 Q 720 30 840 48"/>
    <path id="c6" d="M600 140 Q 720 250 840 232"/>
    <path id="c7" d="M600 140 Q 800 60 1030 72"/>
    <path id="c8" d="M600 140 Q 800 220 1030 208"/>
  </defs>

  <rect x="1" y="1" width="1198" height="278" rx="22" fill="url(#panel)" stroke="#1e3a5f" stroke-opacity="0.7"/>

  <g fill="#e0f2fe">
    <circle cx="80" cy="40" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="250" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="28" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="258" r="1.2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="34" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="244" r="1.4"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.6s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="none" stroke-width="1.4">
    <use xlink:href="#c1" stroke="#34d399" stroke-opacity="0.34" stroke-dasharray="5 9"><animate attributeName="stroke-dashoffset" from="0" to="-140" dur="7s" repeatCount="indefinite"/></use>
    <use xlink:href="#c2" stroke="#22d3ee" stroke-opacity="0.34" stroke-dasharray="5 9"><animate attributeName="stroke-dashoffset" from="0" to="140" dur="8s" repeatCount="indefinite"/></use>
    <use xlink:href="#c3" stroke="#a78bfa" stroke-opacity="0.34" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" from="0" to="-120" dur="6s" repeatCount="indefinite"/></use>
    <use xlink:href="#c4" stroke="#f0abfc" stroke-opacity="0.34" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" from="0" to="120" dur="7.4s" repeatCount="indefinite"/></use>
    <use xlink:href="#c5" stroke="#67e8f9" stroke-opacity="0.34" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" from="0" to="-120" dur="6.8s" repeatCount="indefinite"/></use>
    <use xlink:href="#c6" stroke="#fbbf24" stroke-opacity="0.34" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" from="0" to="120" dur="7.8s" repeatCount="indefinite"/></use>
    <use xlink:href="#c7" stroke="#f472b6" stroke-opacity="0.34" stroke-dasharray="5 9"><animate attributeName="stroke-dashoffset" from="0" to="-140" dur="8.2s" repeatCount="indefinite"/></use>
    <use xlink:href="#c8" stroke="#34d399" stroke-opacity="0.34" stroke-dasharray="5 9"><animate attributeName="stroke-dashoffset" from="0" to="140" dur="7.6s" repeatCount="indefinite"/></use>
  </g>

  <g fill="#ecfeff" filter="url(#glow)">
    <circle r="2.2"><animateMotion dur="7s" repeatCount="indefinite"><mpath xlink:href="#c1"/></animateMotion></circle>
    <circle r="2.2"><animateMotion dur="8s" repeatCount="indefinite"><mpath xlink:href="#c2"/></animateMotion></circle>
    <circle r="2" fill="#ddd6fe"><animateMotion dur="6s" repeatCount="indefinite"><mpath xlink:href="#c3"/></animateMotion></circle>
    <circle r="2" fill="#fbcfe8"><animateMotion dur="7.4s" repeatCount="indefinite"><mpath xlink:href="#c4"/></animateMotion></circle>
    <circle r="2" fill="#a5f3fc"><animateMotion dur="6.8s" repeatCount="indefinite"><mpath xlink:href="#c5"/></animateMotion></circle>
    <circle r="2" fill="#fde68a"><animateMotion dur="7.8s" repeatCount="indefinite"><mpath xlink:href="#c6"/></animateMotion></circle>
    <circle r="2.2" fill="#fbcfe8"><animateMotion dur="8.2s" repeatCount="indefinite"><mpath xlink:href="#c7"/></animateMotion></circle>
    <circle r="2.2"><animateMotion dur="7.6s" repeatCount="indefinite"><mpath xlink:href="#c8"/></animateMotion></circle>
  </g>

  <circle cx="600" cy="140" r="64" fill="url(#core)">
    <animate attributeName="r" values="56;72;56" dur="5s" repeatCount="indefinite"/>
  </circle>
  <polygon points="600,96 637,118 637,162 600,184 563,162 563,118" fill="#061321" stroke="#22d3ee" stroke-opacity="0.7"/>
  <polygon points="600,84 648,112 648,168 600,196 552,168 552,112" fill="none" stroke="#c4b5fd" stroke-opacity="0.4" stroke-dasharray="6 8">
    <animateTransform attributeName="transform" type="rotate" from="0 600 140" to="360 600 140" dur="20s" repeatCount="indefinite"/>
  </polygon>
  <text x="600" y="145" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="13" font-weight="800" letter-spacing="2" fill="#ecfeff">STACK</text>

  <g font-family="Fira Code, Consolas, monospace" font-size="11" font-weight="800" text-anchor="middle" fill="#dbeafe">
    <g transform="translate(170 72)"><circle r="20" fill="#07192a" stroke="#34d399" stroke-opacity="0.7"/><circle r="27" fill="none" stroke="#34d399" stroke-opacity="0.3"><animate attributeName="r" values="20;29;20" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/></circle><text y="4">RUST</text></g>
    <g transform="translate(170 208)"><circle r="20" fill="#07192a" stroke="#22d3ee" stroke-opacity="0.7"/><circle r="27" fill="none" stroke="#22d3ee" stroke-opacity="0.3"><animate attributeName="r" values="20;29;20" dur="3.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="3.5s" repeatCount="indefinite"/></circle><text y="4">C</text></g>
    <g transform="translate(360 48)"><circle r="20" fill="#07192a" stroke="#a78bfa" stroke-opacity="0.7"/><circle r="27" fill="none" stroke="#a78bfa" stroke-opacity="0.3"><animate attributeName="r" values="20;29;20" dur="4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="4s" repeatCount="indefinite"/></circle><text y="4">PY</text></g>
    <g transform="translate(360 232)"><circle r="20" fill="#07192a" stroke="#f0abfc" stroke-opacity="0.7"/><circle r="27" fill="none" stroke="#f0abfc" stroke-opacity="0.3"><animate attributeName="r" values="20;29;20" dur="3.2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="3.2s" repeatCount="indefinite"/></circle><text y="4">TS</text></g>
    <g transform="translate(840 48)"><circle r="20" fill="#07192a" stroke="#67e8f9" stroke-opacity="0.7"/><circle r="27" fill="none" stroke="#67e8f9" stroke-opacity="0.3"><animate attributeName="r" values="20;29;20" dur="3.8s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="3.8s" repeatCount="indefinite"/></circle><text y="4">NEXT</text></g>
    <g transform="translate(840 232)"><circle r="20" fill="#07192a" stroke="#fbbf24" stroke-opacity="0.7"/><circle r="27" fill="none" stroke="#fbbf24" stroke-opacity="0.3"><animate attributeName="r" values="20;29;20" dur="4.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="4.4s" repeatCount="indefinite"/></circle><text y="4">PRISMA</text></g>
    <g transform="translate(1030 72)"><circle r="20" fill="#07192a" stroke="#f472b6" stroke-opacity="0.7"/><circle r="27" fill="none" stroke="#f472b6" stroke-opacity="0.3"><animate attributeName="r" values="20;29;20" dur="3.1s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="3.1s" repeatCount="indefinite"/></circle><text y="4">DOCKER</text></g>
    <g transform="translate(1030 208)"><circle r="20" fill="#07192a" stroke="#34d399" stroke-opacity="0.7"/><circle r="27" fill="none" stroke="#34d399" stroke-opacity="0.3"><animate attributeName="r" values="20;29;20" dur="3.7s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="3.7s" repeatCount="indefinite"/></circle><text y="4">FASTAPI</text></g>
  </g>

  <text x="34" y="34" font-family="Fira Code, Consolas, monospace" font-size="11" letter-spacing="2.4" fill="#6ee7b7">CONSTELLATION MAP // ACTIVE NODES</text>
  <text x="1166" y="262" text-anchor="end" font-family="Fira Code, Consolas, monospace" font-size="11" letter-spacing="2.4" fill="#94a3b8">EVERY TOOL IS A STAR IN THE SYSTEM</text>
</svg>
