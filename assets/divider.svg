<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="20%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="80%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="70" y1="20" x2="1130" y2="20" stroke="url(#flow)" stroke-width="2" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="5s" repeatCount="indefinite"/>
  </line>
  <circle cx="600" cy="20" r="5" fill="#34d399">
    <animate attributeName="r" values="4;9;4" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="20" r="3" fill="#22d3ee"/>
  <circle cx="920" cy="20" r="3" fill="#a78bfa"/>
</svg>
