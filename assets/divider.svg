<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="46" viewBox="0 0 1400 46" role="img" aria-label="animated energy divider">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="18%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="82%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="90" y1="23" x2="1310" y2="23" stroke="url(#flow)" stroke-width="2" stroke-dasharray="12 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-220" dur="5s" repeatCount="indefinite"/>
  </line>
  <circle r="3.4" fill="#ecfeff" filter="url(#glow)">
    <animateMotion path="M 90 23 L 1310 23" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.45">
    <circle cx="700" cy="23" r="5">
      <animate attributeName="r" values="4;10;4" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0.1;0.7" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="23" r="2.4" fill="#34d399" stroke="none" filter="url(#glow)"/>
  </g>
  <g fill="#67e8f9" opacity="0.7">
    <rect x="320" y="20" width="6" height="6" transform="rotate(45 323 23)"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="1074" y="20" width="6" height="6" transform="rotate(45 1077 23)"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></rect>
  </g>
</svg>
