<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="SNSX SPACE - CEH. Satya Narayan Sahu">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#14294a"/>
      <stop offset="55%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#04060e"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d1fae5" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="orbitA" d="M 130 140 A 470 78 0 1 1 1070 140 A 470 78 0 1 1 130 140"/>
    <path id="orbitB" d="M 220 140 A 380 58 0 1 1 980 140 A 380 58 0 1 1 220 140"/>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <g fill="#e5f3ff">
    <circle cx="70" cy="52" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="148" cy="208" r="1.1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="232" cy="74" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="318" cy="232" r="1.2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="402" cy="46" r="1.0"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="486" cy="196" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="34" r="1.1"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="648" cy="246" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="724" cy="56" r="1.2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="808" cy="218" r="1.0"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="892" cy="40" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="976" cy="238" r="1.2"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="4.0s" repeatCount="indefinite"/></circle>
    <circle cx="1058" cy="68" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1136" cy="192" r="1.1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="142" r="1.0"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1164" cy="126" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.9s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="none" stroke-width="1.2">
    <use xlink:href="#orbitA" stroke="#22d3ee" stroke-opacity="0.22" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="9s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#orbitB" stroke="#a78bfa" stroke-opacity="0.20" stroke-dasharray="4 12">
      <animate attributeName="stroke-dashoffset" from="0" to="160" dur="12s" repeatCount="indefinite"/>
    </use>
  </g>

  <circle r="4.5" fill="#34d399" filter="url(#glow)">
    <animateMotion dur="9s" repeatCount="indefinite"><mpath xlink:href="#orbitA"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="12s" repeatCount="indefinite"><mpath xlink:href="#orbitB"/></animateMotion>
  </circle>

  <circle cx="600" cy="140" r="54" fill="url(#core)">
    <animate attributeName="r" values="46;60;46" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="140" r="8" fill="#ecfeff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.55;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <circle r="2.2" fill="#ffffff">
    <animateMotion path="M -20 60 L 1220 210" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="8" fill="url(#title)" filter="url(#glow)">SNSX SPACE<animate attributeName="opacity" values="0;1;1" dur="1.4s" fill="freeze"/></text>
  <text x="600" y="166" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="2.5" fill="#bfdbfe">SYSTEMS · LANGUAGE · SECURITY · INTELLIGENCE<animate attributeName="opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite"/></text>
  <text x="600" y="232" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#94a3b8">CEH. SATYA NARAYAN SAHU  //  BUILDING IN PUBLIC SINCE 2020</text>
</svg>
