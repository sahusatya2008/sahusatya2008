<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-label="SNSX SPACE animated mission hero">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#12305a"/>
      <stop offset="45%" stop-color="#091327"/>
      <stop offset="100%" stop-color="#03060d"/>
    </radialGradient>
    <radialGradient id="nebulaA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfeff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="48%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18"/>
    </filter>
    <path id="orbitOuter" d="M 150 210 A 550 142 0 1 1 1250 210 A 550 142 0 1 1 150 210"/>
    <path id="orbitMid" d="M 260 210 A 440 106 0 1 1 1140 210 A 440 106 0 1 1 260 210"/>
    <path id="orbitInner" d="M 380 210 A 320 72 0 1 1 1020 210 A 320 72 0 1 1 380 210"/>
  </defs>

  <rect width="1400" height="420" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <ellipse cx="370" cy="150" rx="290" ry="130" fill="url(#nebulaA)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 32 -14; 0 0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.8;0.45" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1050" cy="285" rx="320" ry="140" fill="url(#nebulaB)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -28 12; 0 0" dur="21s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="11s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g stroke="#67e8f9" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 70 H1400 M0 140 H1400 M0 280 H1400 M0 350 H1400">
      <animate attributeName="stroke-dashoffset" from="0" to="120" dur="16s" repeatCount="indefinite"/>
    </path>
    <path d="M100 0 V420 M300 0 V420 M500 0 V420 M700 0 V420 M900 0 V420 M1100 0 V420 M1300 0 V420">
      <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="20s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#e0f2fe">
    <circle cx="48" cy="62" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="126" cy="312" r="1.1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="88" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="294" cy="368" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="376" cy="44" r="1.0"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="452" cy="292" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="76" r="1.1"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="628" cy="392" r="1.7"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="714" cy="50" r="1.2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="802" cy="344" r="1.0"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="886" cy="38" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="972" cy="374" r="1.3"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="4.0s" repeatCount="indefinite"/></circle>
    <circle cx="1056" cy="66" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1138" cy="322" r="1.1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="1224" cy="92" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1322" cy="286" r="1.2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="1372" cy="150" r="1.0"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="32" cy="196" r="1.0"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="210" r="1.0"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="190" r="1.0"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="none" stroke-width="1.4">
    <use xlink:href="#orbitOuter" stroke="#22d3ee" stroke-opacity="0.26" stroke-dasharray="7 13">
      <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="14s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#orbitMid" stroke="#a78bfa" stroke-opacity="0.24" stroke-dasharray="5 12">
      <animate attributeName="stroke-dashoffset" from="0" to="170" dur="18s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#orbitInner" stroke="#34d399" stroke-opacity="0.20" stroke-dasharray="3 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-130" dur="10s" repeatCount="indefinite"/>
    </use>
  </g>

  <g transform="translate(700 210)">
    <path d="M0 0 L 230 -58 A 237 237 0 0 1 230 58 Z" fill="url(#sweep)" opacity="0.42">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle r="5.5" fill="#34d399" filter="url(#glow)">
    <animateMotion dur="14s" repeatCount="indefinite"><mpath xlink:href="#orbitOuter"/></animateMotion>
  </circle>
  <circle r="4" fill="#c4b5fd" filter="url(#glow)">
    <animateMotion dur="18s" repeatCount="indefinite"><mpath xlink:href="#orbitMid"/></animateMotion>
  </circle>
  <circle r="3.4" fill="#67e8f9" filter="url(#glow)">
    <animateMotion dur="10s" repeatCount="indefinite"><mpath xlink:href="#orbitInner"/></animateMotion>
  </circle>

  <g fill="#a5f3fc">
    <circle r="2.3">
      <animateMotion path="M 40 340 C 300 310 410 120 700 210" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.0">
      <animateMotion path="M 1360 90 C 1080 120 970 320 700 210" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.8" fill="#f0abfc">
      <animateMotion path="M 180 30 C 420 10 560 360 700 210" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle r="2.8" fill="#ffffff" filter="url(#glow)">
    <animateMotion path="M -60 80 L 1460 330" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/>
  </circle>

  <circle cx="700" cy="210" r="80" fill="url(#planetGlow)">
    <animate attributeName="r" values="70;88;70" dur="6s" repeatCount="indefinite"/>
  </circle>
  <polygon points="700,158 746,184 746,236 700,262 654,236 654,184" fill="none" stroke="#c4b5fd" stroke-opacity="0.42" stroke-width="1.4" stroke-dasharray="7 9">
    <animateTransform attributeName="transform" type="rotate" from="0 700 210" to="360 700 210" dur="26s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="700" cy="210" r="43" fill="#07111f" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.4"/>
  <circle cx="700" cy="210" r="29" fill="#0b1c33"/>
  <path d="M 672 202 Q 700 186 728 202" fill="none" stroke="#34d399" stroke-width="1.4" stroke-opacity="0.7">
    <animate attributeName="stroke-opacity" values="0.25;0.9;0.25" dur="4s" repeatCount="indefinite"/>
  </path>
  <circle cx="700" cy="210" r="9" fill="#ecfeff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.55;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <g stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M 24 62 V 24 H 62">
      <animate attributeName="stroke-opacity" values="0.25;0.8;0.25" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 1338 24 H 1376 V 62">
      <animate attributeName="stroke-opacity" values="0.8;0.25;0.8" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 24 358 V 396 H 62">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="4.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 1376 358 V 396 H 1338">
      <animate attributeName="stroke-opacity" values="0.9;0.4;0.9" dur="4.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="700" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="12" fill="url(#titleGrad)" filter="url(#glow)">SNSX SPACE<animate attributeName="opacity" values="0;1;1" dur="1.6s" fill="freeze"/></text>
  <text x="700" y="234" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="3.2" fill="#bfdbfe">SYSTEMS · LANGUAGE · SECURITY · INTELLIGENCE<animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/></text>
  <text x="700" y="380" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.4" fill="#94a3b8">CEH. SATYA NARAYAN SAHU  //  BUILDING IN PUBLIC SINCE 2020</text>
  <g transform="translate(1120 374)">
    <circle cx="0" cy="0" r="4" fill="#34d399" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="5" font-family="Fira Code, Consolas, monospace" font-size="12" letter-spacing="2" fill="#6ee7b7">SIGNAL: LIVE</text>
  </g>
  <text x="70" y="382" font-family="Fira Code, Consolas, monospace" font-size="12" letter-spacing="2" fill="#64748b">ORBIT 01 / EARTH</text>
</svg>
