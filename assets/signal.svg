<svg xmlns="http://www.w3.org/2000/svg" width="260" height="70" viewBox="0 0 260 70" role="img" aria-label="animated live signal meter">
  <defs>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="258" height="68" rx="14" fill="#07101d" stroke="#1e3a5f" stroke-opacity="0.7"/>
  <g fill="url(#bar)" filter="url(#glow)">
    <rect x="24" y="30" width="8" height="16" rx="4"><animate attributeName="height" values="10;32;14;26;10" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="36;14;32;20;36" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="40" y="24" width="8" height="24" rx="4"><animate attributeName="height" values="24;12;34;16;24" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="22;34;12;30;22" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="56" y="18" width="8" height="32" rx="4"><animate attributeName="height" values="18;36;12;30;18" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="24;6;30;12;24" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="72" y="26" width="8" height="22" rx="4"><animate attributeName="height" values="30;14;26;10;30" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="16;32;20;36;16" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="88" y="20" width="8" height="30" rx="4"><animate attributeName="height" values="14;28;36;18;14" dur="2.2s" repeatCount="indefinite"/><animate attributeName="y" values="28;14;6;24;28" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="104" y="32" width="8" height="14" rx="4"><animate attributeName="height" values="20;10;30;16;20" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="26;36;16;30;26" dur="1.6s" repeatCount="indefinite"/></rect>
  </g>
  <circle cx="136" cy="35" r="4" fill="#34d399" filter="url(#glow)"><animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"/></circle>
  <text x="152" y="40" font-family="Fira Code, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#a7f3d0">SIGNAL LIVE</text>
</svg>
